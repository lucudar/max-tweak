name: Build MAXMods Tweak
on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    env:
      THEOS: /tmp/theos
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Theos
        run: |
          set -e
          # Install dependencies
          brew install ldid make

          # Clone Theos
          git clone --recursive --depth=1 https://github.com/theos/theos.git $THEOS

          # Use the SDK from Xcode already installed on the runner
          SDKROOT=$(xcrun --sdk iphoneos --show-sdk-path)
          echo "Using SDK: $SDKROOT"
          mkdir -p $THEOS/sdks
          ln -s "$SDKROOT" "$THEOS/sdks/iPhoneOS16.5.sdk"

      - name: Build Tweak
        run: |
          export PATH="/opt/homebrew/opt/make/libexec/gnubin:$THEOS/bin:$PATH"
          make clean
          make FINALPACKAGE=1

      - name: Find and upload dylib
        run: |
          DYLIB=$(find .theos -name "MAXMods.dylib" -type f | head -1)
          if [ -z "$DYLIB" ]; then
            echo "ERROR: dylib not found!"
            find .theos -type f
            exit 1
          fi
          echo "Found: $DYLIB"
          file "$DYLIB"
          cp "$DYLIB" ./MAXMods.dylib

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MAXMods-dylib
          path: MAXMods.dylib
          retention-days: 30
