name: Build MAXMods Tweak
on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    env:
      THEOS: /tmp/theos
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Theos
        run: |
          set -e
          # Install dependencies
          brew install ldid make

          # Clone Theos
          git clone --recursive --depth=1 https://github.com/theos/theos.git $THEOS

          # Use the SDK from Xcode already installed on the runner
          SDKROOT=$(xcrun --sdk iphoneos --show-sdk-path)
          echo "Using SDK: $SDKROOT"
          mkdir -p $THEOS/sdks
          ln -s "$SDKROOT" "$THEOS/sdks/iPhoneOS16.5.sdk"

      - name: Build Tweak
        run: |
          export PATH="/opt/homebrew/opt/make/libexec/gnubin:$THEOS/bin:$PATH"
          make clean
          make FINALPACKAGE=1

      - name: Find dylib
        run: |
          DYLIB=$(find .theos -name "MAXMods.dylib" -type f | head -1)
          if [ -z "$DYLIB" ]; then
            echo "ERROR: dylib not found!"
            find .theos -type f
            exit 1
          fi
          echo "Found: $DYLIB"
          file "$DYLIB"
          cp "$DYLIB" ./MAXMods.dylib

      - name: Create Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="1.1.$(git rev-list --count HEAD)"
          gh release delete "v${VERSION}" --yes 2>/dev/null || true
          gh release create "v${VERSION}" MAXMods.dylib \
            --title "MAXMods v${VERSION}" \
            --notes "Auto-build from $(git log -1 --format='%h %s')"
